# Host-side workspace. The AVR firmware lives in `firmware/` and is deliberately
# excluded: it needs a pinned nightly toolchain and `build-std`, whereas the game
# logic in `crates/` builds and tests on stable Rust on your laptop and in CI.
[workspace]
resolver = "3"
members = ["crates/pinball-core"]
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Rob Hannan"]
repository = "https://github.com/robhannan/fun-house-pinball"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Embedded code legitimately narrows integers all the time.
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
