<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -70 600 1290" width="600" height="1290" font-family="Helvetica, Arial, sans-serif">
  <title>Fun House (1956) playfield wiring reference</title>
  <desc>Drawn to scale in millimetres: x from the board's left edge, y from its back edge (the end by the backbox). The board, the arch's ends, the shooter lane and the centres of the bumpers, trapdoors, rollovers, bonus wheel, flipper pivots, centre post and outhole, the bumper caps' and outhole's sizes, the flippers' length and the gap between their tips (at rest and held up) were measured on the table with a tape, and the trapdoor holes, the left wall and the shooter lane's walls, the flippers' widths, centre post, outhole and rollover buttons with calipers. The arch, kickers, rubbers and lamps were traced from a photo with the playfield tracer, by eye; everything else is assumed. hardware/3d/measurements.scad measures y from the front edge instead. Labels give each part's switch matrix position (C = column, R = row), coil number and lamp number, matching crates/pinball-core/src/playfield.rs. The data-switch, data-coil and data-lamp attributes drive the simulator in sim/ and are checked against playfield.rs by its tests. The simulator's ball physics also takes its geometry from this file: data-wall marks solid walls and posts, and data-gate a one-way gate. data-board marks the board's edge, and data-measured labels the parts whose centres were measured, which the trace page (sim/web/trace/) uses to line a photo up with this map.</desc>

  <style>
    .label { font-size: 10px; fill: #1f2328; }
    .tag { font-size: 9px; fill: #57606a; }
    .title { font-size: 18px; font-weight: bold; fill: #1f2328; }
    .sub { font-size: 11px; fill: #57606a; }
    .wheel { font-size: 10px; font-weight: bold; fill: #1f2328; text-anchor: middle; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>

  <rect x="-40" y="-70" width="600" height="1290" fill="#ffffff"/>

  <text x="240" y="-46" class="title mid">Fun House (Williams, 1956): wiring reference</text>
  <text x="240" y="-30" class="sub mid">To scale, in mm. Measured: board, walls, arch ends, shooter lane, part centres and sizes.</text>
  <text x="240" y="-16" class="sub mid">Kickers, rubbers and lamps traced from a photo. Parts marked * are assumed.</text>

  <!-- The board, 520 x 1079 mm -->
  <rect x="0" y="0" width="520" height="1079" fill="#e9dcc0" stroke="#8a6d3b" stroke-width="1" data-board=""/>

  <!-- Playfield outline, inside the 12.7 mm left wall and the shooter lane's
       12.9 mm outer wall: the arch meets the left wall 860 mm from the front,
       and the shooter lane's outer wall 805 mm from the front; its radius is
       traced from a photo. The bottom edge is the apron (assumed), stepping down in the
       shooter lane to the plunger's tip. -->
  <path d="M 12.7 1012 L 12.7 219 A 253.3 253.3 0 0 1 507 274 L 507 1034 L 459 1034 L 459 1012 Z" fill="#fdf6e3" stroke="#8a6d3b" stroke-width="3" data-wall=""/>
  <!-- The 12.7 mm wall along the left edge -->
  <rect x="0" y="219" width="12.7" height="793" fill="#c4a26a" stroke="#8a6d3b" stroke-width="1"/>

  <!-- Shooter lane (right edge): 35 mm wide between 12.9 mm walls. Above
       the straight, the inner wall curves round with the arch, keeping the
       lane's width, to the gate on the curve. The gate's middle was
       measured 935 mm from the front edge and 450 mm from the left wall -->
  <rect x="459" y="269" width="13" height="765" fill="#c4a26a" stroke="#8a6d3b" stroke-width="1" data-wall=""/>
  <path d="M 472 269 A 218.3 218.3 0 0 0 427.5 161.3 L 417.3 169.2 A 205.4 205.4 0 0 1 459 269 Z" fill="#c4a26a" stroke="#8a6d3b" stroke-width="1" data-wall=""/>
  <line x1="428.5" y1="160.6" x2="453.4" y2="141.4" stroke="#57606a" stroke-width="2" stroke-dasharray="4 3" data-gate=""/>
  <circle cx="489.5" cy="1020" r="7" fill="#c9d1d9" stroke="#57606a" data-switch="C0R1"/>
  <text x="494" y="990" class="label" transform="rotate(-90 494 990)">Shooter lane: C0·R1 *</text>

  <!-- Top corners: jack-in-the-box kickers (assumed) -->
  <circle cx="62" cy="150.5" r="10" fill="#57606a" data-wall=""/>
  <text x="77" y="147" class="tag">roller</text>
  <g fill="#fff3b0" stroke="#1f2328" stroke-width="3" stroke-linejoin="round">
    <polygon points="43.5,187 88,187.5 85,250.5 32.5,291 20.5,290 37,196.5" data-switch="C1R4" data-coil="21"/>
    <polygon points="424.5,167 384.5,189.5 383,252 436.5,294.5 446.5,289.5 450.5,212" data-switch="C1R5" data-coil="22"/>
  </g>
  <text x="18" y="306" class="tag">Jack-in-the-box</text>
  <text x="18" y="317" class="tag">C1·R4 · coil 21</text>
  <text x="452" y="308" class="tag end">Jack-in-the-box</text>
  <text x="452" y="319" class="tag end">C1·R5 · coil 22</text>

  <!-- Top rubbers: "advance bonus when lit" (assumed) -->
  <g fill="#f6c6cb" stroke="#d73a49" stroke-width="3" stroke-linejoin="round">
    <polygon points="132,191.5 142.5,190.5 168,302.5 154.5,305 130,247.5" data-switch="C3R0"/>
    <polygon points="337.5,192 326.5,190.5 302,298 314,304.5 338.5,248" data-switch="C3R1"/>
  </g>
  <g fill="#ffd33d" stroke="#9a6700" stroke-width="2">
    <circle cx="195" cy="303" r="9" data-lamp="6"/>
    <circle cx="275" cy="303" r="9" data-lamp="7"/>
  </g>
  <text x="160" y="318" class="tag end">Top rubber *: C3·R0</text>
  <text x="160" y="329" class="tag end">advance bonus: L6</text>
  <text x="310" y="318" class="tag">Top rubber *: C3·R1</text>
  <text x="310" y="329" class="tag">advance bonus: L7</text>

  <!-- Top lanes: "10 points" rollover buttons outside the rubbers (position
       assumed) -->
  <g fill="#c9d1d9" stroke="#57606a">
    <circle cx="103" cy="259" r="2.7" data-switch="C3R2"/>
    <circle cx="367" cy="259" r="2.7" data-switch="C3R3"/>
  </g>
  <text x="103" y="276" class="tag mid">10</text>
  <text x="367" y="276" class="tag mid">10</text>
  <text x="103" y="286" class="tag mid">C3·R2</text>
  <text x="367" y="286" class="tag mid">C3·R3</text>

  <!-- Top bumper: "10 points", 80 mm cap -->
  <circle cx="235" cy="219" r="40" fill="#ffffff" stroke="#d73a49" stroke-width="3" data-switch="C2R5" data-coil="18" data-lamp="29" data-measured="Top bumper centre"/>
  <text x="235" y="217" class="label mid">10</text>
  <text x="235" y="229" class="tag mid">points</text>
  <text x="235" y="160" class="tag mid">Top bumper</text>
  <text x="235" y="171" class="tag mid">C2·R5 · coil 18 · L29</text>

  <!-- Upper pop bumpers: "1 point", 75 mm caps -->
  <g fill="#7ee787" stroke="#1a7f37" stroke-width="2">
    <circle cx="112" cy="374" r="37.5" data-switch="C2R0" data-coil="3" data-lamp="24" data-measured="Pop 1 centre (upper left)"/>
    <circle cx="363" cy="374" r="37.5" data-switch="C2R2" data-coil="5" data-lamp="26" data-measured="Pop 3 centre (upper right)"/>
  </g>
  <circle cx="237" cy="349" r="37.5" fill="#ffaba8" stroke="#86181d" stroke-width="2" data-switch="C2R1" data-coil="4" data-lamp="25" data-measured="Pop 2 centre (upper middle)"/>
  <text x="112" y="371" class="label mid">Pop 1</text>
  <text x="112" y="384" class="tag mid">1 point</text>
  <text x="237" y="346" class="label mid">Pop 2</text>
  <text x="237" y="359" class="tag mid">1 point</text>
  <text x="363" y="371" class="label mid">Pop 3</text>
  <text x="363" y="384" class="tag mid">1 point</text>
  <text x="112" y="424" class="tag mid">C2·R0 · coil 3 · L24</text>
  <text x="363" y="424" class="tag mid">C2·R2 · coil 5 · L26</text>
  <text x="237" y="399" class="tag mid">C2·R1 · coil 4 · L25</text>

  <!-- Trapdoor lamps: "trap door open when lite is lit" (assumed) -->
  <g fill="#ffd33d" stroke="#9a6700" stroke-width="1.5">
    <rect x="168.5" y="426" width="4" height="24"/>
    <rect x="233.5" y="426" width="4" height="24"/>
    <rect x="297.5" y="426" width="4" height="24"/>
    <circle cx="170.5" cy="419" r="7" data-lamp="3"/>
    <circle cx="235.5" cy="419" r="7" data-lamp="4"/>
    <circle cx="299.5" cy="419" r="7" data-lamp="5"/>
  </g>

  <!-- "Scores Bonus" box with its three trapdoors: holes 30.5 x 65 mm, their
       centres 65.5 mm apart -->
  <rect x="136" y="450" width="198" height="104" rx="4" fill="#ffffff" stroke="#d73a49" stroke-width="3"/>
  <text x="235" y="462" class="tag mid">TRAP DOOR OPEN WHEN LITE IS LIT</text>
  <g fill="#1f2328">
    <rect x="154.25" y="481.5" width="30.5" height="65" rx="2" data-switch="C4R5" data-trapdoor="0" data-measured="Left trapdoor hole centre"/>
    <rect x="219.75" y="481.5" width="30.5" height="65" rx="2" data-switch="C4R6" data-trapdoor="1" data-measured="Middle trapdoor hole centre"/>
    <rect x="285.25" y="481.5" width="30.5" height="65" rx="2" data-switch="C4R7" data-trapdoor="2" data-measured="Right trapdoor hole centre"/>
  </g>
  <text x="235" y="476" class="label mid">SCORES BONUS</text>
    
  <!-- "10 points" lanes, two either side of the box (rails assumed) -->
  <g stroke="#8a6d3b" stroke-width="3">
    <line x1="79" y1="470" x2="79" y2="539" data-wall=""/>
    <line x1="137" y1="470" x2="137" y2="539" data-wall=""/>
    <line x1="329" y1="470" x2="329" y2="539" data-wall=""/>
    <line x1="388" y1="470" x2="388" y2="539" data-wall=""/>
  </g>
  <g class="tag mid">
    <text x="50" y="486">10</text>
    <text x="108" y="486">10</text>
    <text x="358" y="486">10</text>
    <text x="418" y="486">10</text>
  </g>
  <g fill="#c9d1d9" stroke="#57606a">
    <circle cx="50" cy="514" r="2.7" data-switch="C4R0" data-measured="Lane 1 rollover (far left)"/>
    <circle cx="108" cy="514" r="2.7" data-switch="C4R1" data-measured="Lane 2 rollover"/>
    <circle cx="358" cy="514" r="2.7" data-switch="C4R2" data-measured="Lane 3 rollover"/>
    <circle cx="418" cy="514" r="2.7" data-switch="C4R3" data-measured="Lane 4 rollover (far right)"/>
  </g>
  <text x="79" y="455" class="tag mid">lanes 1–2: C4·R0, R1</text>
  <text x="388" y="455" class="tag mid">lanes 3–4: C4·R2, R3</text>

  <!-- "30 points when lit": a lamp below each lane (assumed) -->
  <g fill="#57606a">
    <polygon points="50,546 45,556 55,556"/>
    <polygon points="108,546 103,556 113,556"/>
    <polygon points="358,546 353,556 363,556"/>
    <polygon points="418,546 413,556 423,556"/>
  </g>
  <g fill="#ffd33d" stroke="#9a6700" stroke-width="2">
    <circle cx="67.5" cy="585" r="7.5" data-lamp="20"/>
    <circle cx="111" cy="585" r="7.5" data-lamp="21"/>
    <circle cx="359" cy="585" r="7.5" data-lamp="22"/>
    <circle cx="406" cy="585" r="7.5" data-lamp="23"/>
  </g>
  <text x="89" y="589" class="label mid">30</text>
  <text x="382.5" y="589" class="label mid">30</text>
  <text x="89" y="606" class="tag mid">30 when lit: L20, L21</text>
  <text x="382.5" y="606" class="tag mid">30 when lit: L22, L23</text>

  <!-- Special when lit (assumed) -->
  <polygon points="236.5,559.5 265.5,605.5 256,606 263.5,616.5 208.5,617 218.5,604 207.5,604" fill="#ffd33d" stroke="#9a6700" stroke-width="2" data-lamp="2"/>
  <text x="204" y="590" class="tag end">Special when lit: L2</text>

  <!-- Side kickers: striped, under the lower pop bumpers (assumed) -->
  <g fill="#f6c6cb" stroke="#1f2328" stroke-width="3" stroke-linejoin="round">
    <polygon points="21.5,576.5 33.5,576.5 73.5,678.5 32.5,777 22,778" data-switch="C1R2" data-coil="19"/>
    <polygon points="451,581 436,581 406,677 439,776.5 451,776.5" data-switch="C1R3" data-coil="20"/>
  </g>
  <text x="-22" y="677" class="label mid" transform="rotate(-90 -22 677)">Left side kicker: C1·R2 · coil 19</text>
  <text x="-8" y="677" class="tag mid" transform="rotate(-90 -8 677)">Pop 4: advance bonus when lit *</text>
  <text x="526" y="677" class="label mid" transform="rotate(90 526 677)">Right side kicker: C1·R3 · coil 20</text>
  <text x="540" y="677" class="tag mid" transform="rotate(90 540 677)">Pop 5: advance bonus when lit *</text>

  <!-- Lower pop bumpers: red, "1 point", 60 mm caps -->
  <g fill="#ffaba8" stroke="#86181d" stroke-width="2">
    <circle cx="52" cy="677" r="30" data-switch="C2R3" data-coil="6" data-lamp="27" data-measured="Pop 4 centre (lower left)"/>
    <circle cx="422" cy="677" r="30" data-switch="C2R4" data-coil="7" data-lamp="28" data-measured="Pop 5 centre (lower right)"/>
  </g>
  <text x="52" y="664" class="label mid">Pop 4</text>
  <text x="52" y="675" class="tag mid">1 point</text>
  <text x="52" y="686" class="tag mid">C2·R3</text>
  <text x="52" y="696" class="tag mid">coil 6 · L27</text>
  <text x="422" y="664" class="label mid">Pop 5</text>
  <text x="422" y="675" class="tag mid">1 point</text>
  <text x="422" y="686" class="tag mid">C2·R4</text>
  <text x="422" y="696" class="tag mid">coil 7 · L28</text>

  <!-- Bonus wheel (lamps only): lamps 77 mm from its centre -->
  <circle cx="235" cy="724" r="100" fill="#ffd8d3" stroke="#d73a49" stroke-width="2" data-measured="Bonus wheel centre"/>
  <g fill="#ffd33d" stroke="#9a6700" stroke-width="1.5">
    <circle cx="235.5" cy="642.5" r="7.5" data-lamp="8"/>
    <circle cx="280" cy="658" r="7.5" data-lamp="9"/>
    <circle cx="307.5" cy="695.5" r="7.5" data-lamp="10"/>
    <circle cx="308" cy="743" r="7.5" data-lamp="11"/>
    <circle cx="280.5" cy="780" r="7.5" data-lamp="12"/>
    <circle cx="235.5" cy="794" r="7.5" data-lamp="13"/>
    <circle cx="191" cy="780.5" r="7.5" data-lamp="14"/>
    <circle cx="163.5" cy="742.5" r="7.5" data-lamp="15"/>
    <circle cx="163.5" cy="694.5" r="7.5" data-lamp="16"/>
    <circle cx="191" cy="657.5" r="7.5" data-lamp="17"/>
  </g>
  <text x="235.5" y="646" class="wheel">10</text>
  <text x="280" y="661.5" class="wheel">20</text>
  <text x="307.5" y="699" class="wheel">30</text>
  <text x="308" y="746.5" class="wheel">40</text>
  <text x="280.5" y="783.5" class="wheel">50</text>
  <text x="235.5" y="797.5" class="wheel">60</text>
  <text x="191" y="784" class="wheel">70</text>
  <text x="163.5" y="746" class="wheel">80</text>
  <text x="163.5" y="698" class="wheel">90</text>
  <text x="191" y="661" class="wheel">100</text>
  <circle cx="235.5" cy="718" r="17" fill="#7ee787" stroke="#1a7f37" stroke-width="2" data-lamp="18"/>
  <text x="235.5" y="716" class="tag mid">centre</text>
  <text x="235.5" y="726" class="tag mid">L18</text>
  <text x="235" y="838" class="label mid">Bonus wheel (lamps only): 10 → L8 … 100 → L17</text>

  <!-- Kicking rubbers (assumed) -->
  <polygon points="22.5,787 20.5,846.5 121,906.5 127.2,855.1" fill="#ffffff" stroke="#1f2328" stroke-width="3" data-switch="C1R0" data-coil="1"/>
  <polygon points="446.5,788 449.5,847.5 353,904.5 347.4,856.6" fill="#ffffff" stroke="#1f2328" stroke-width="3" data-switch="C1R1" data-coil="2"/>
  <text x="92" y="800" class="label">Left kicker</text>
  <text x="92" y="811" class="tag">C1·R0 · coil 1</text>
  <text x="380" y="800" class="label end">Right kicker</text>
  <text x="380" y="811" class="tag end">C1·R1 · coil 2</text>

  <!-- Apron: no outlanes, so the kickers meet the walls, and a V under the
       flippers funnels a drained ball into the outhole (all assumed) -->
  <g stroke="#8a6d3b" stroke-width="3" stroke-linecap="round">
    <line x1="22" y1="778" x2="22.5" y2="787" data-wall=""/>
    <line x1="451" y1="776.5" x2="446.5" y2="788" data-wall=""/>
    <line x1="127.2" y1="855.1" x2="160" y2="878" data-wall=""/>
    <line x1="347.4" y1="856.6" x2="312" y2="878" data-wall=""/>
    <line x1="150" y1="912" x2="219" y2="1003" data-wall=""/>
    <line x1="322" y1="912" x2="255" y2="1003" data-wall=""/>
  </g>
  <rect x="12.7" y="1012" width="446.3" height="67" fill="#c9d1d9" stroke="#57606a" stroke-width="1"/>

  <!-- Flippers (inward facing): pivots 162 mm apart, 63 mm long, 21.3 mm
       wide at the pivot and 15.4 mm at the tip; the tips are 80 mm apart at
       rest and 83 mm held up -->
  <g fill="#ffffff" stroke="#1f2328" stroke-width="3" stroke-linejoin="round">
    <path d="M 146.5 895.4 L 182.2 937.8 L 194.4 928.5 L 163.5 882.6 Z" data-coil="8 9" data-flipper="left"/>
    <path d="M 308.5 882.6 L 277.6 928.5 L 289.8 937.8 L 325.5 895.4 Z" data-coil="10 11" data-flipper="right"/>
  </g>
  <circle cx="155" cy="889" r="7" fill="#57606a" data-measured="Left flipper pivot"/>
  <circle cx="317" cy="889" r="7" fill="#57606a" data-measured="Right flipper pivot"/>
  <text x="100" y="925" class="label mid">Left flipper</text>
  <text x="100" y="938" class="tag mid">coils 8 (power), 9 (hold)</text>
  <text x="372" y="925" class="label mid">Right flipper</text>
  <text x="372" y="938" class="tag mid">coils 10 (power), 11 (hold)</text>

  <!-- Centre post (18.7 mm across, with its rubber) and outhole (37.8 mm) -->
  <circle cx="235" cy="934" r="9.35" fill="#ffffff" stroke="#1f2328" stroke-width="2" data-wall="" data-measured="Centre post"/>
  <circle cx="237" cy="984" r="18.9" fill="#1f2328" data-switch="C0R0" data-coil="0" data-measured="Outhole centre"/>
  <text x="228" y="1032" class="label mid">Apron * · the outhole's switch C0·R0 and ball serve</text>
  <text x="228" y="1045" class="label mid">coil 0 are on the ball lift, under it</text>

  <!-- Legend -->
  <g transform="translate(0, 1110)">
    <text x="0" y="0" class="label" font-weight="bold">Key</text>
    <circle cx="8" cy="16" r="7" fill="#7ee787" stroke="#1a7f37"/>
    <text x="22" y="20" class="label">Pop bumper (switch + coil + cap lamp)</text>
    <circle cx="8" cy="36" r="7" fill="#ffd33d" stroke="#9a6700"/>
    <text x="22" y="40" class="label">Lamp</text>
    <circle cx="8" cy="56" r="6" fill="#c9d1d9" stroke="#57606a"/>
    <text x="22" y="60" class="label">Rollover button</text>
    <rect x="1" y="70" width="14" height="10" rx="2" fill="#1f2328"/>
    <text x="22" y="80" class="label">Trapdoor (switch + flap servo)</text>
    <rect x="1" y="90" width="14" height="10" fill="#f6c6cb" stroke="#d73a49" stroke-width="2"/>
    <text x="22" y="100" class="label">Rubber switch</text>
    <text x="250" y="20" class="label">C2·R0 = switch matrix column 2, row 0</text>
    <text x="250" y="40" class="label">coil 3 = coil output 3 · L24 = lamp output 24</text>
    <text x="250" y="60" class="label">Cabinet buttons and tilts: see the wiring guide</text>
    <text x="250" y="80" class="label">1 unit = 1 mm on the real table</text>
    <text x="250" y="100" class="label">Trapdoors 1–3: C4·R5–R7 · servos D5, D2, D3 · L3–L5</text>
  </g>
</svg>
