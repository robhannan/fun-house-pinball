name: Branch checks

# Catches pushes to a branch whose pull request has already been merged: the
# new commits would never reach main. Start a new branch from origin/main
# instead (CLAUDE.md, pull request rules).
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  not-merged:
    name: Branch's PR not already merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check for a merged PR on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: npm run check:merged-branch
