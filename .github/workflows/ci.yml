name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Game logic (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the right toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Installs pnpm (version from package.json), Node.js (from .nvmrc) and
      # the locked dependencies.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: No build output or OS files committed
        run: pnpm run check:stray-files
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Build the browser simulator
        run: pnpm run build:sim

  firmware:
    name: Firmware (ATmega2560)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Firmware size
        run: avr-size --format=avr --mcu=atmega2560 target/avr-none/release/fun-house-firmware.elf
      - uses: actions/upload-artifact@v7
        with:
          name: fun-house-firmware
          path: firmware/target/avr-none/release/fun-house-firmware.elf
