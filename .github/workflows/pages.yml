name: Pages

# Builds the site: the browser simulator, and the parts tracker from
# docs/shopping-list.md. Pull requests only build it, which fails on a table
# row the tracker can't read; pushes to main also deploy it to GitHub Pages.
# The counts are on the parts-data branch, so saving them doesn't run this.
on:
  push:
    branches: [main]
    paths:
      - "docs/shopping-list.md"
      - "site/**"
      - "sim/serve.mjs"
      - "sim/serve.test.mjs"
      # The simulator: its page, and the game logic and drawings it's built from.
      - "sim/build.mjs"
      - "sim/web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "docs/playfield.svg"
      - "docs/backboard.svg"
      - ".github/workflows/pages.yml"
      - ".github/scripts/ci.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "docs/shopping-list.md"
      - "site/**"
      - "sim/serve.mjs"
      - "sim/serve.test.mjs"
      # The simulator: its page, and the game logic and drawings it's built from.
      - "sim/build.mjs"
      - "sim/web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "docs/playfield.svg"
      - "docs/backboard.svg"
      - ".github/workflows/pages.yml"
      - ".github/scripts/ci.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older build, but a deploy to
# Pages is never cancelled part-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the simulator and parts tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Test the shopping list parser and the preview server
        run: pnpm run test:site
      - run: pnpm run ci:toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build the simulator and the parts tracker
        run: pnpm run build:site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/generated

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
