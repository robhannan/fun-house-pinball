name: Pages

# Builds the parts tracker from docs/shopping-list.md. Pull requests only
# build it, which fails on a table row the tracker can't read; pushes to main
# also deploy it to GitHub Pages. The counts are on the parts-data branch, so
# saving them doesn't run this.
on:
  push:
    branches: [main]
    paths:
      - "docs/shopping-list.md"
      - "site/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "docs/shopping-list.md"
      - "site/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the parts tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Build the site from the shopping list
        run: pnpm run build:site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/generated

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}parts/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
